default_preset: dividend_stability
presets:
  dividend_stability:
    name: "Dividend & Stability"
    description: "Income, low beta, quality, drawdown guardrails"
    weights:
      value: 0.9
      quality: 1.2
      earnings_quality: 1.1
      momentum: 0.6
      risk_defensive: 1.4
      shareholder_yield: 1.3
      growth: 0.5
    toggles:
      prefer_dividends: true
      low_beta: true
      low_volatility: true
      hate_debt: true
      avoid_event_risk: true
    filters:
      dividend_yield_min: 0.02
      beta_cap: 0.9
      vol_cap: 0.2
      market_cap_min: 5e9
      adv_min: 2e6
    risk:
      single_name_cap: 0.08
      defense_mode_cash_buffer: 0.2
  quality_compounders:
    name: "Quality Compounders"
    description: "ROIC, margin stability, low leverage"
    weights:
      value: 0.8
      quality: 1.4
      earnings_quality: 1.2
      momentum: 0.8
      risk_defensive: 1.0
      shareholder_yield: 0.9
      growth: 0.9
    toggles:
      prefer_pricing_power: true
      prefer_moat: true
      hate_debt: true
    filters:
      debt_to_equity_max: 1.0
      net_debt_ebitda_max: 2.0
      interest_coverage_min: 5.0
  garp:
    name: "GARP"
    description: "Quality + growth + rozumná valuace"
    weights:
      value: 1.0
      quality: 1.0
      momentum: 0.9
      growth: 1.2
    toggles:
      avoid_quality_traps: true
    filters:
      peg_max: 2.0
  deep_value:
    name: "Deep Value"
    description: "Value heavy s quality guardrails"
    weights:
      value: 1.6
      quality: 1.0
      earnings_quality: 1.1
      momentum: 0.5
      risk_defensive: 1.0
    toggles:
      avoid_quality_traps: true
      hate_debt: true
    filters:
      ev_ebitda_max: 8
      fcf_yield_min: 0.08
  momentum_trend:
    name: "Momentum Trend"
    description: "Momentum + risk controls"
    weights:
      momentum: 1.6
      quality: 1.0
      risk_defensive: 1.2
      value: 0.7
    toggles:
      avoid_event_risk: true
      low_volatility: true
  defensive:
    name: "Defensive / Risk-Off"
    description: "Low-vol/quality, cash buffer"
    weights:
      quality: 1.3
      risk_defensive: 1.6
      shareholder_yield: 1.1
      value: 1.0
    toggles:
      low_beta: true
      low_volatility: true
      prefer_dividends: true
    filters:
      beta_cap: 0.8
      vol_cap: 0.18
  cyclicals_macro:
    name: "Cyclicals Macro"
    description: "Vyšší citlivost na makro, váhy podle sazeb"
    weights:
      momentum: 1.1
      quality: 0.9
      value: 1.1
      growth: 0.8
    toggles:
      region_focus: "US"
    filters:
      momentum_12m_min: 0.05
      market_cap_min: 3e9
      adv_min: 1e6
